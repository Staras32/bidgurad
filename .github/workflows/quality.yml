name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deterministic BOQ rules
        run: npx --yes tsx scripts/verify-boq-rules.ts
      - name: Verify OCR table reconstruction
        run: npx --yes tsx scripts/verify-ocr-fixture.ts
