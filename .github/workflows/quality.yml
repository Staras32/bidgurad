name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify deterministic BOQ rules
        run: pnpm exec tsx scripts/verify-boq-rules.ts
      - name: Verify OCR table reconstruction
        run: pnpm exec tsx scripts/verify-ocr-fixture.ts
      - name: Verify work package operations
        run: pnpm exec tsx scripts/verify-work-packages.ts
